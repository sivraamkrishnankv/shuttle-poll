name: shuttle-poll

on:
  schedule:
    # 6:00 PM IST, every day (timezone declared, no UTC conversion)
    - cron: '0 18 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send poll
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
        run: python send_poll.py

  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api -X PUT
          repos/${{ github.repository }}/actions/workflows/poll.yml/enable